<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1240" width="1240" height="1240" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#50504c"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>

  <rect width="1240" height="1240" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="600" fill="#1f1e1b">claude-remote — how a stuck session reaches your phone</text>
  <text x="40" y="70" font-size="14" fill="#50504c">Blue arrows carry ciphertext. The 32-byte key exists only on the Mac and the phone.</text>

  <!-- ===== MacBook ===== -->
  <rect x="40" y="100" width="380" height="520" rx="10" fill="#fafaf8" stroke="#d8d6d0"/>
  <text x="60" y="128" font-size="15" font-weight="600" fill="#1f1e1b">MacBook</text>

  <rect x="62" y="146" width="336" height="60" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="78" y="170" font-size="14" font-weight="600" fill="#1f1e1b">Claude Code session</text>
  <text x="78" y="190" font-size="12" fill="#50504c">SessionStart · Notification · Stop · PreToolUse</text>

  <rect x="62" y="228" width="336" height="76" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="78" y="252" font-size="14" font-weight="600" fill="#1f1e1b">emit.mjs — hook</text>
  <text x="78" y="271" font-size="12" fill="#50504c">appends one JSON line, exits 0, always</text>
  <text x="78" y="289" font-size="12" fill="#50504c">no network, no secrets, ~45 ms</text>

  <rect x="62" y="326" width="156" height="54" rx="7" fill="#f3f2ee" stroke="#c9c7c1"/>
  <text x="78" y="348" font-size="13" font-weight="600" fill="#1f1e1b">spool/</text>
  <text x="78" y="366" font-size="11" fill="#50504c">day.jsonl</text>

  <rect x="242" y="326" width="156" height="54" rx="7" fill="#f3f2ee" stroke="#c9c7c1"/>
  <text x="258" y="348" font-size="13" font-weight="600" fill="#1f1e1b">decisions/</text>
  <text x="258" y="366" font-size="11" fill="#50504c">&lt;requestId&gt;.json</text>

  <rect x="62" y="404" width="336" height="118" rx="7" fill="#ffffff" stroke="#8f8d86" stroke-width="1.5"/>
  <text x="78" y="428" font-size="14" font-weight="600" fill="#1f1e1b">bridge service (launchd)</text>
  <text x="78" y="449" font-size="12" fill="#50504c">summarise → scrub → seal (AES-256-GCM)</text>
  <text x="78" y="467" font-size="12" fill="#50504c">publishes state · relays approvals</text>
  <text x="78" y="485" font-size="12" fill="#50504c">injects replies: claude --bg --resume</text>
  <text x="78" y="508" font-size="12" fill="#50504c">2 s poll · heartbeat · fails closed to `ask`</text>

  <rect x="62" y="544" width="336" height="54" rx="7" fill="#f3f2ee" stroke="#c9c7c1"/>
  <text x="78" y="566" font-size="13" font-weight="600" fill="#1f1e1b">macOS Keychain</text>
  <text x="78" y="584" font-size="11" fill="#50504c">shared key · Firebase refresh token · uid</text>

  <!-- ===== Firebase ===== -->
  <rect x="470" y="100" width="330" height="520" rx="10" fill="#fafaf8" stroke="#d8d6d0"/>
  <text x="490" y="128" font-size="15" font-weight="600" fill="#1f1e1b">Personal Firebase project</text>
  <text x="490" y="147" font-size="12" fill="#50504c">rules: auth.uid === $uid, blob &lt; 4096</text>

  <rect x="492" y="164" width="286" height="208" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="508" y="188" font-size="14" font-weight="600" fill="#1f1e1b">Realtime Database  /u/{uid}</text>
  <text x="508" y="212" font-size="12" fill="#50504c">sessions/{id}   state + summary</text>
  <text x="508" y="233" font-size="12" fill="#50504c">replies/{id}     phone → Mac</text>
  <text x="508" y="254" font-size="12" fill="#50504c">approvals/{id}  request + decision</text>
  <text x="508" y="275" font-size="12" fill="#50504c">pushes/{id}      fan-out queue</text>
  <text x="508" y="296" font-size="12" fill="#50504c">devices/{id}     FCM tokens</text>
  <text x="508" y="326" font-size="11" fill="#8a8781">every node: { v, ts, blob }</text>
  <text x="508" y="345" font-size="11" fill="#8a8781">blob is opaque — Google cannot read it</text>

  <rect x="492" y="396" width="286" height="88" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="508" y="420" font-size="14" font-weight="600" fill="#1f1e1b">Cloud Function  onPush</text>
  <text x="508" y="440" font-size="12" fill="#50504c">trigger on pushes/{id}</text>
  <text x="508" y="458" font-size="12" fill="#50504c">forwards blob, prunes dead tokens</text>
  <text x="508" y="476" font-size="12" fill="#50504c">admin access, still learns nothing</text>

  <rect x="492" y="508" width="286" height="62" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="508" y="532" font-size="14" font-weight="600" fill="#1f1e1b">FCM</text>
  <text x="508" y="552" font-size="12" fill="#50504c">data-only, high priority, no title text</text>

  <!-- ===== Phone ===== -->
  <rect x="850" y="100" width="350" height="520" rx="10" fill="#fafaf8" stroke="#d8d6d0"/>
  <text x="870" y="128" font-size="15" font-weight="600" fill="#1f1e1b">Android phone</text>

  <rect x="872" y="150" width="306" height="70" rx="7" fill="#f3f2ee" stroke="#c9c7c1"/>
  <text x="888" y="174" font-size="13" font-weight="600" fill="#1f1e1b">Android Keystore</text>
  <text x="888" y="193" font-size="11" fill="#50504c">shared key, arrives once by QR</text>
  <text x="888" y="211" font-size="11" fill="#50504c">non-exportable once imported</text>

  <rect x="872" y="244" width="306" height="84" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="888" y="268" font-size="14" font-weight="600" fill="#1f1e1b">session list</text>
  <text x="888" y="288" font-size="12" fill="#50504c">decrypts locally, shows state</text>
  <text x="888" y="306" font-size="12" fill="#50504c">+ a redacted one-line summary</text>

  <rect x="872" y="352" width="306" height="72" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="888" y="376" font-size="14" font-weight="600" fill="#1f1e1b">reply box</text>
  <text x="888" y="396" font-size="12" fill="#50504c">text → sealed → replies/</text>
  <text x="888" y="414" font-size="12" fill="#50504c">delivered only while idle</text>

  <rect x="872" y="448" width="306" height="72" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="888" y="472" font-size="14" font-weight="600" fill="#1f1e1b">approve / deny</text>
  <text x="888" y="492" font-size="12" fill="#50504c">answers a flagged tool prompt</text>
  <text x="888" y="510" font-size="12" fill="#50504c">15 s, else the Mac prompts locally</text>

  <rect x="872" y="544" width="306" height="54" rx="7" fill="#ffffff" stroke="#c9c7c1"/>
  <text x="888" y="566" font-size="13" font-weight="600" fill="#1f1e1b">notification</text>
  <text x="888" y="584" font-size="11" fill="#50504c">text composed on-device after decrypt</text>

  <!-- ===== arrows: Mac internal ===== -->
  <path d="M230,206 L230,228" stroke="#50504c" fill="none" marker-end="url(#a)"/>
  <path d="M140,304 L140,326" stroke="#50504c" fill="none" marker-end="url(#a)"/>
  <path d="M140,380 L140,404" stroke="#50504c" fill="none" marker-end="url(#a)"/>
  <path d="M320,404 L320,380" stroke="#50504c" fill="none" marker-end="url(#a)"/>
  <path d="M320,326 L320,304" stroke="#50504c" fill="none" marker-end="url(#a)"/>
  <text x="332" y="318" font-size="11" fill="#50504c">allow / deny</text>
  <path d="M230,544 L230,522" stroke="#50504c" fill="none" marker-end="url(#a)"/>

  <!-- ===== arrows: Mac <-> Firebase ===== -->
  <path d="M398,440 L492,268" stroke="#1f6feb" fill="none" marker-end="url(#ac)"/>
  <text x="404" y="400" font-size="11" fill="#1f6feb">publish state, queue push</text>
  <path d="M492,300 L398,478" stroke="#1f6feb" fill="none" marker-end="url(#ac)"/>
  <text x="404" y="508" font-size="11" fill="#1f6feb">poll replies + decisions</text>

  <!-- ===== Firebase internal ===== -->
  <path d="M635,372 L635,396" stroke="#50504c" fill="none" marker-end="url(#a)"/>
  <path d="M635,484 L635,508" stroke="#50504c" fill="none" marker-end="url(#a)"/>

  <!-- ===== Firebase <-> phone ===== -->
  <path d="M778,538 L872,571" stroke="#1f6feb" fill="none" marker-end="url(#ac)"/>
  <text x="786" y="596" font-size="11" fill="#1f6feb">push (ciphertext)</text>
  <path d="M872,286 L778,250" stroke="#1f6feb" fill="none" marker-end="url(#ac)"/>
  <text x="786" y="232" font-size="11" fill="#1f6feb">read sessions</text>
  <path d="M872,388 L778,300" stroke="#1f6feb" fill="none" marker-end="url(#ac)"/>
  <text x="786" y="352" font-size="11" fill="#1f6feb">write reply / decision</text>

  <!-- ===== pairing ===== -->
  <path d="M398,578 C560,700 720,700 872,200" stroke="#8a8781" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"/>
  <text x="560" y="706" font-size="12" fill="#50504c">one-time QR pairing — the only time the key moves, and it never touches the network</text>


  <rect x="40" y="760" width="1160" height="300" rx="8" fill="#ffffff" stroke="#d8d6d0"/>
  <text x="60" y="790" font-size="15" font-weight="600" fill="#1f1e1b">The two journeys end to end</text>

  <text x="60" y="824" font-size="13" font-weight="600" fill="#1f6feb">A session gets stuck, you unblock it from the sofa</text>
  <text x="60" y="850" font-size="12.5" fill="#50504c">1.  Claude Code needs input. The Notification hook appends one line to the spool and exits.</text>
  <text x="60" y="874" font-size="12.5" fill="#50504c">2.  The service reads it, writes a one-line summary, scrubs it, seals it, and PUTs sessions/{id} plus a pushes/{id} node.</text>
  <text x="60" y="898" font-size="12.5" fill="#50504c">3.  onPush fires, forwards the sealed blob to FCM, and deletes the queue node. Nothing readable passes through Google.</text>
  <text x="60" y="922" font-size="12.5" fill="#50504c">4.  The phone decrypts with the Keystore key and builds the notification locally. You type a reply; it is sealed into replies/{id}.</text>
  <text x="60" y="946" font-size="12.5" fill="#50504c">5.  The service picks it up within 2 s. Idle session: claude --bg --resume. Busy session: the node stays put and is retried.</text>

  <text x="60" y="984" font-size="13" font-weight="600" fill="#1f6feb">A flagged tool wants permission while you are away</text>
  <text x="60" y="1010" font-size="12.5" fill="#50504c">1.  PreToolUse fires for Bash, Write or Edit in an enrolled session. The hook spools the request and blocks — 15 s, no longer.</text>
  <text x="60" y="1034" font-size="12.5" fill="#50504c">2.  The service relays it; you tap approve or deny; the answer comes back sealed and lands in decisions/&lt;requestId&gt;.json.</text>
  <text x="60" y="1058" font-size="12.5" fill="#50504c">3.  The hook reads the file and prints allow or deny. No answer in time, or a forged one: it prints ask and the Mac prompts as usual.</text>

  <!-- ===== failure note ===== -->
  <rect x="40" y="1090" width="1160" height="110" rx="8" fill="#fbf8f0" stroke="#e0d9c4"/>
  <text x="60" y="1122" font-size="13" font-weight="600" fill="#1f1e1b">If any of this breaks, your sessions do not.</text>
  <text x="60" y="1148" font-size="12" fill="#50504c">Service down or network gone: the hook still appends and exits 0, the spool grows, nothing stalls. Heartbeat stale: a flagged tool prompts locally at once.</text>
  <text x="60" y="1172" font-size="12" fill="#50504c">Phone silent for 15 s: the prompt falls back to `ask`. A forged reply or decision fails AES-GCM and is discarded before it reaches a session.</text>
</svg>
